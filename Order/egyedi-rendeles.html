<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Festményvilág</title>

    <script src="../Dev/mock-api.js"></script> <!-- ez csak nekem, hogy hozzaferjek az adatbazisodhoz -->

    <script src="../Navigation/auth.js"></script>

    <!-- ugy ahogy van, kivettem a bootstrapet, mert nem szeretem, hogy merev -->

    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="egyedi-rendeles.css" />

    <script type="module" src="check-rendeles.js"></script>
  </head>
  <body data-requires-auth>

    <!-- Navigációs sáv: -->
    <header id="navi"></header>

    <!-- Egyedi megrendelés: -->
    <section class="section">
      <div class="container container--narrow">

        <div class="section-head section-head--center">
          <span class="eyebrow">Egyedi rendelés</span>
          <h2>Megrendelés leadása</h2>
        </div>

        <div class="panel">

          <p class="lead" style="margin-bottom: 2rem;">
            Az alábbi űrlapon egyedi megrendelés adható le. A leadott rendelések elkészítése
            14 munkanapon belül megtörténik. Ha azt szeretnéd, hogy egy fénykép kerüljön
            lefestésre, kérjük töltsd fel a fotót!
          </p>

          <div class="upload-layout">

            <div class="form-grid">

              <div class="field">
                <label for="technika">Technika</label>
                <select id="technika">
                  <option disabled selected>Válassz…</option>
                </select>
              </div>

              <div class="field">
                <label for="meret">Méret</label>
                <select id="meret" required>
                  <option disabled selected>Válassz…</option>
                  <option value="20x40cm">20 × 40 cm</option>
                  <option value="40x60cm">40 × 60 cm</option>
                  <option value="60x80cm">60 × 80 cm</option>
                </select>
              </div>

              <div class="field span-2">
                <label for="leiras">Leírás</label>
                <textarea id="leiras" rows="5" placeholder="Milyennek képzeled el a leendő festményedet?" required></textarea>
              </div>

            </div>

            <!-- kepet az urlap aljara tettem -->
            <div class="field">
              <span class="field-label">Fotó (opcionális)</span>
              <div class="img_upload" id="upload-form">
                <div class="img_upload__hint">
                  <ion-icon name="image-outline"></ion-icon>
                  <span>Kattints a kép kiválasztásához</span>
                </div>
                <input type="file" id="file-input" accept="image/*" hidden>
              </div>
            </div>

          </div>

          <div class="center-button">
            <button id="add-product-button" type="button" class="btn">Ajánlat kérése</button>
          </div>

        </div>
      </div>
    </section>

    <!-- Footer: -->
    <footer id="footer"></footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="egyedi-rendeles.js"></script>
    <script type="module" src="../Navigation/loginscript.js"></script>
    <script src="../Navigation/basket.js"></script>
    <script type="module" src="../Navigation/permission-checker.js"></script>
    <script src="../Navigation/darkmode.js" defer></script>
  </body>
</html>
