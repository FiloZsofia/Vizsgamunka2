<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Festményvilág</title>

    <script src="../Dev/mock-api.js"></script> <!-- ez csak nekem, hogy hozzaferjek az adatbazisodhoz -->
    <script src="../Navigation/custom-alert.js" defer></script>
    <script src="../Navigation/auth.js"></script>

    <!-- ugy ahogy van, kivettem a bootstrapet, mert nem szeretem, hogy merev -->

    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="termek-feltoltese.css" />
</head>
<body data-requires-auth>

    <!-- Navigációs sáv: -->
    <header id="navi"></header>

    <!-- Termék feltöltése: -->
    <section class="section">
      <div class="container container--narrow">

        <div class="section-head section-head--center">
          <span class="eyebrow">Feltöltés</span>
          <h2>Termék feltöltése</h2>
        </div>

        <div class="panel">
          <div class="upload-layout">

            <div class="form-grid">

              <div class="field span-2">
                <label for="productName">Festmény neve</label>
                <input type="text" id="productName" placeholder="pl. Hajnali kikötő" required/>
              </div>

              <div class="field span-2">
                <label for="artist">Művész</label>
                <input type="text" id="artist" placeholder="pl. Kovács Anna"/>
              </div>

              <div class="field">
                <label for="keszitesEve">Készítés éve</label>
                <input type="number" min="0" id="keszitesEve" placeholder="2024"/>
              </div>

              <div class="field">
                <label for="ar">Ár (Ft)</label>
                <input type="number" min="0" id="ar" placeholder="45000" required/>
              </div>

              <div class="field">
                <span class="field-label">Technika</span>
                <div class="dropdown">
                  <button type="button" class="dropbtn" data-placeholder="Válassz…">Válassz…</button>
                  <div class="dropdown-content" id="technika"></div>
                </div>
              </div>

              <div class="field">
                <span class="field-label">Téma</span>
                <div class="dropdown">
                  <button type="button" class="dropbtn" data-placeholder="Válassz…">Válassz…</button>
                  <div class="dropdown-content" id="tema"></div>
                </div>
              </div>

              <div class="field span-2">
                <span class="field-label">Méret</span>
                <div class="meret-inputs">
                  <input type="number" min="1" id="meretHossz" placeholder="80" required>
                  <span class="meret-x">×</span>
                  <input type="number" min="1" id="meretSzeles" placeholder="60" required>
                  <span>cm</span>
                </div>
              </div>

              <div class="field span-2">
                <label for="leiras">Leírás</label>
                <textarea id="leiras" rows="4" placeholder="Mit érdemes tudni a műről?"></textarea>
              </div>

            </div>

            <!-- kepet az urlap aljara tettem -->
            <div class="field">
              <span class="field-label">Kép</span>
              <div class="img_upload" id="upload-form">
                <div class="img_upload__hint">
                  <ion-icon name="image-outline"></ion-icon>
                  <span>Kattints a kép kiválasztásához</span>
                </div>
                <input type="file" id="file-input" accept="image/*" hidden>
              </div>

              <label for="imgUrl" style="margin-top: 1rem;">Kép útvonala</label>
              <input type="text" id="imgUrl" placeholder="../Assets/images/festmeny.jpg">
              <p class="field-hint">
                A szerver nem tárol fájlt, csak hivatkozást. Másold a képet az
                <code>Assets/images</code> mappába, és írd ide az útvonalát —
                fájlválasztáskor ezt automatikusan kitöltjük.
              </p>
            </div>

          </div>

          <p class="form-status" id="feltoltes-status" hidden></p>

          <div class="center-button">
            <button id="add-products-button" type="button" class="btn" data-test-id="add-products-button">Termék hozzáadása</button>
          </div>
        </div>

      </div>
    </section>

    <!-- Footer: -->
    <footer id="footer"></footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="../Navigation/navigation-template.js"></script>
    <script src="../Footer/footer-template.js"></script>
    <script src="termek-feltoltese.js"></script>
    <script src="filter.js"></script>
    <script type="module" src="../Navigation/loginscript.js"></script>
    <script type="module" src="../Navigation/permission-checker.js"></script>
    <script type="module" src="check-feltoltes.js"></script>
    <script src="../Navigation/basket.js"></script>
    <script src="../Navigation/darkmode.js" defer></script>
</body>
</html>
