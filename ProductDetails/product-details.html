<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festményvilág</title>

    <script src="../Dev/mock-api.js"></script> <!-- ez csak nekem, hogy hozzaferjek az adatbazisodhoz -->

    <script src="../Navigation/auth.js"></script>

    <!-- ugy ahogy van, kivettem a bootstrapet, mert nem szeretem, hogy merev -->

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="product-details.css">
</head>
<body>

    <!-- Navigációs sáv: -->
    <header id="navi"></header>

    <!--    A termék:    -->
    <section class="section">
        <div class="container">
            <div class="product-detail">

                <div class="product-detail__media" id="kep">
                    <img src="" alt="">
                </div>

                <div class="product-detail__info">
                    <h1 id="title"></h1>
                    <p id="artist" class="muted"></p>

                    <p id="price" class="product-detail__price"></p>

                    <div class="product-detail__meta">
                        <p id="created-year"></p>
                        <p id="material"></p>
                        <p id="style"></p>
                        <p id="size"></p>
                    </div>

                    <p id="description"></p>

                    <button id="kosar" class="btn">Kosárba</button>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer: -->
    <footer id="footer"></footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="product-details.js"></script>
    <script type="module" src="../Navigation/loginscript.js"></script>
    <script src="../Navigation/basket.js"></script>
    <script type="module" src="../Navigation/permission-checker.js"></script>

</body>
</html>
