<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festményvilág</title>

    <script src="../Dev/mock-api.js"></script> <!-- ez csak nekem, hogy hozzaferjek az adatbazisodhoz -->
    <script src="../Navigation/custom-alert.js" defer></script>
    <script src="../Navigation/auth.js"></script>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="cikkek.css">
</head>
<body>
    <header id="navi"></header>

    <section class="section">
      <div class="container">

        <div class="section-head section-head--center">
          <span class="eyebrow">Magazin</span>
          <h2>Cikkek és interjúk</h2>
          <p class="lead" style="margin: 1rem auto 0;">
            Műterem-látogatások, technikai útmutatók és beszélgetések azokkal,
            akik a képeket festik. Új írás minden hónapban.
          </p>
        </div>

        <!-- kiemelt cikk
          ez eddig statikus volt, mar a legfrissebbet teszi meg automatikusan kiemeltkent
          (ezt lehetne melyiteni, hogy adminkent te dontsd el, melyik cikk legyen a kiemelt, de nem akarnek most ezzel baszakodni) -->
        <article class="cikk-kiemelt" id="cikk-kiemelt" hidden>
          <a class="cikk-kiemelt__kep" id="kiemelt-kep-link" href="#">
            <img id="kiemelt-kep" src="" alt="">
          </a>
          <div class="cikk-kiemelt__szoveg">
            <span class="cikk-cimke" id="kiemelt-cimke"></span>
            <h3><a id="kiemelt-cim-link" href="#"></a></h3>
            <p class="muted" id="kiemelt-lead"></p>
            <p class="cikk-meta" id="kiemelt-meta"></p>
          </div>
        </article>

        <div class="cikk-racs" id="cikk-racs"></div>

        <div class="center-button">
          <button type="button" class="btn btn--ghost" id="tobb-cikk">További cikkek</button>
        </div>

      </div>
    </section>

    <section class="section section--alt">
      <div class="container container--narrow">
        <div class="hirlevel-sav">
          <div>
            <h3>Ne maradj le egy írásról sem</h3>
            <p class="muted">Havonta egy levél, csak a friss cikkekről. Bármikor leiratkozhatsz.</p>
          </div>
          <form class="hirlevel-urlap" onsubmit="return false">
            <input type="email" placeholder="E-mail cím" aria-label="E-mail cím">
            <button type="submit" class="btn">Feliratkozom</button>
          </form>
        </div>
      </div>
    </section>

    <footer id="footer"></footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="../Navigation/navigation-template.js"></script>
    <script src="../Footer/footer-template.js"></script>
    <script src="cikkek.js"></script>
    <script type="module" src="../Navigation/loginscript.js"></script>
    <script src="../Navigation/basket.js"></script>
    <script src="../Navigation/darkmode.js" defer></script>
</body>
</html>
